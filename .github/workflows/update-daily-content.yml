name: Update daily content

on:
  schedule:
    # 00:22 UTC = 08:22 Singapore time — off the round-number minute mark
    # (:00/:15/:30/:45) since GitHub's scheduler is more likely to delay or
    # skip runs queued at those popular times under high global load.
    - cron: '22 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch today's content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_daily.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          git diff --staged --quiet || git commit -m "Update daily content ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push
