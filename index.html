<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shirley">
<meta name="theme-color" content="#ff4d94">
<title>Shirley · Personal Growth Hub</title>
<style>
  :root{
    --bg-page:linear-gradient(160deg, #ffd9ec 0%, #ffe9c9 55%, #e9d4ff 100%); --bg:rgba(255,247,250,0.55); --surface:rgba(255,255,255,0.55); --surface-alt:rgba(255,255,255,0.35);
    --line:rgba(255,255,255,0.5); --ink:#3a1f26; --muted:#6b4a54; --accent:#ff4d94;
    --accent-ink:#ffffff; --accent-soft:rgba(255,77,148,0.18); --accent-2:#ffb020; --accent-2-soft:rgba(255,176,32,0.2);
    --accent-grad:linear-gradient(135deg, #ff4d94, #ffb020);
    --warn:#e2a63b; --warn-soft:rgba(226,166,59,0.2); --danger:#ff5a5f; --danger-soft:rgba(255,90,95,0.18);
    --ok:#20c997; --ok-soft:rgba(32,201,151,0.18);
    --blob-1:#ff8fc7; --blob-2:#ffd166; --blob-3:#c77dff;
    --shadow:0 30px 60px -30px rgba(120,20,50,0.35); --status-fg:#3a1f26; color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg-page:#1c1014; --bg:#241419; --surface:#2c1920; --surface-alt:#331b23;
      --line:#452530; --ink:#f7e8ec; --muted:#c79aa6; --accent:#ef6a90;
      --accent-ink:#241419; --accent-soft:#3d2029; --accent-2:#d9b969; --accent-2-soft:#3a2f1c;
      --warn:#eab454; --warn-soft:#3c2f16; --danger:#e5615c; --danger-soft:#3a1e1d;
      --ok:#63c98d; --ok-soft:#183b28;
      --shadow:0 30px 60px -30px rgba(0,0,0,0.6); --status-fg:#f7e8ec; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg-page:#1c1014; --bg:#241419; --surface:#2c1920; --surface-alt:#331b23;
    --line:#452530; --ink:#f7e8ec; --muted:#c79aa6; --accent:#ef6a90;
    --accent-ink:#241419; --accent-soft:#3d2029; --accent-2:#d9b969; --accent-2-soft:#3a2f1c;
    --warn:#eab454; --warn-soft:#3c2f16; --danger:#e5615c; --danger-soft:#3a1e1d;
    --ok:#63c98d; --ok-soft:#183b28;
    --shadow:0 30px 60px -30px rgba(0,0,0,0.6); --status-fg:#f7e8ec; color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg-page:#fbeef1; --bg:#fff7f9; --surface:#ffffff; --surface-alt:#fce7ed;
    --line:#f4d7e0; --ink:#3a1f26; --muted:#8f6672; --accent:#db5079;
    --accent-ink:#ffffff; --accent-soft:#fbdce6; --accent-2:#c9a24a; --accent-2-soft:#f5ebd2;
    --warn:#e2a63b; --warn-soft:#fbeacb; --danger:#d6433f; --danger-soft:#f9dcda;
    --ok:#3fa66b; --ok-soft:#dcf1e4;
    --shadow:0 30px 60px -30px rgba(120,20,50,0.35); --status-fg:#3a1f26; color-scheme:light;
  }

  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{
    margin:0; min-height:100dvh; display:flex; flex-direction:column; align-items:center; gap:0;
    padding:0;
    background:radial-gradient(1200px 500px at 50% -10%, color-mix(in srgb, var(--accent) 12%, transparent), transparent), var(--bg-page);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }
  svg.defs{ position:absolute; width:0; height:0; }

  .intro{ display:none; }

  .phone{
    position:relative; width:100vw; max-width:none; height:100dvh; background:var(--bg);
    border-radius:0; padding:0; box-shadow:none; border:none;
  }
  .screen{ position:relative; width:100%; height:100%; background:var(--bg); border-radius:0; overflow:hidden; display:flex; flex-direction:column; }
  .blob-bg{ position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
  .blob-bg span{ position:absolute; border-radius:50%; filter:blur(38px); opacity:0.6; transition:background .4s ease; }
  .blob-bg .b1{ width:210px;height:210px; background:var(--blob-1); top:-50px; left:-60px; }
  .blob-bg .b2{ width:190px;height:190px; background:var(--blob-2); bottom:120px; right:-70px; }
  .blob-bg .b3{ width:170px;height:170px; background:var(--blob-3); bottom:-70px; left:50px; }
  .notch{ display:none; }
  .statusbar{ display:none; }
  .statusbar .icons{ display:flex; align-items:center; gap:5px; }

  .appbar{ position:relative; z-index:1; display:flex; align-items:center; gap:12px; padding:calc(14px + env(safe-area-inset-top)) 18px 14px; flex:0 0 auto; background:var(--surface); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-bottom:1px solid var(--line); }
  .iconbtn{ width:36px;height:36px; border-radius:11px; border:none; background:var(--surface-alt); display:flex;align-items:center;justify-content:center; cursor:pointer; color:var(--ink); flex:0 0 auto; }
  .iconbtn svg{ width:18px; height:18px; }
  .appbar .title{ font-size:17px; font-weight:700; flex:1; }
  .streak-chip{ display:flex; align-items:center; gap:4px; background:var(--accent-2-soft); color:var(--accent-2); font-weight:700; font-size:12px; padding:6px 10px; border-radius:999px; }

  .content{ position:relative; z-index:1; flex:1; overflow-y:auto; padding:2px 18px calc(26px + env(safe-area-inset-bottom)); scrollbar-width:none; }
  .content::-webkit-scrollbar{ display:none; }

  .card, .row-card, .stat, .plan-item, .drawer, .detail, .bio-sheet{ backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; }
  .greet-card{
    background:linear-gradient(150deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 74%, #7a1230) 100%);
    color:#fff; border:none; display:flex; align-items:center; gap:14px;
    box-shadow:0 14px 26px -14px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .greet-card .txt h2{ margin:0 0 3px; font-size:16px; font-weight:700; }
  .greet-card .txt p{ margin:0; font-size:12px; opacity:.88; }

  .stats-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:12px; }
  .stat{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:11px 8px; text-align:center; }
  .stat .num{ font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; display:flex; align-items:center; justify-content:center; gap:3px; }
  .stat .num.gold{ color:var(--accent-2); }
  .stat .num.accent{ color:var(--accent); }
  .stat .lbl{ font-size:10px; color:var(--muted); margin-top:2px; }

  .section-title{ display:flex; align-items:center; justify-content:space-between; margin:16px 2px 8px; }
  .section-title h3{ font-size:13.5px; margin:0; }
  .section-title span{ font-size:11px; color:var(--accent); font-weight:700; cursor:pointer; }

  .plan-list{ display:flex; flex-direction:column; gap:8px; }
  .plan-item{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:9px 12px; font-size:12.5px; }
  .plan-item .txt{ flex:1; }
  .plan-item.done .txt{ color:var(--muted); text-decoration:line-through; }
  .plan-item .tag{ font-size:9.5px; color:var(--muted); background:color-mix(in srgb, var(--ink) 10%, transparent); padding:3px 7px; border-radius:999px; flex:0 0 auto; }

  .quote-card{ margin-top:14px; background:var(--accent-2-soft); border:none; color:var(--ink); }
  .quote-card p{ margin:0; font-size:12.5px; line-height:1.6; font-style:italic; }
  .quote-card .who{ margin-top:6px; font-size:11px; color:var(--muted); font-style:normal; font-weight:700; }

  .chk{ width:19px;height:19px; border-radius:7px; border:1.6px solid var(--line); flex:0 0 auto; cursor:pointer; display:flex; align-items:center; justify-content:center; background:var(--surface); }
  .chk.on{ background:var(--accent-grad); border-color:var(--accent); color:#fff; }
  .chk.chk-ok.on{ background:var(--ok); border-color:var(--ok); }
  .chk svg{ width:11px; height:11px; opacity:0; }
  .chk.on svg{ opacity:1; }

  .del-btn{ width:24px;height:24px; border-radius:8px; border:none; background:transparent; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .del-btn:hover{ background:var(--danger-soft); color:var(--danger); }

  .scrim{ position:absolute; inset:0; background:rgba(30,10,20,0.42); opacity:0; pointer-events:none; transition:opacity .28s ease; z-index:60; }
  .drawer{ position:absolute; top:0; left:0; bottom:0; width:78%; max-width:300px; background:var(--surface); transform:translateX(-105%); transition:transform .32s cubic-bezier(.32,.72,.35,1); z-index:70; display:flex; flex-direction:column; border-radius:0 30px 30px 0; box-shadow:24px 0 50px -30px rgba(0,0,0,0.35); }
  .app.drawer-open .scrim{ opacity:1; pointer-events:auto; }
  .app.drawer-open .drawer{ transform:translateX(0); }

  .drawer-head{ display:flex; align-items:center; gap:12px; padding:calc(34px + env(safe-area-inset-top)) 18px 16px; border-bottom:1px solid var(--line); flex:0 0 auto; cursor:pointer; background:none; border-top:none; border-left:none; border-right:none; width:100%; text-align:left; font:inherit; color:inherit; }
  .avatar-sm{ width:52px; height:52px; border-radius:50%; flex:0 0 auto; background:var(--accent-soft); }
  .avatar-lg{ width:96px; height:96px; border-radius:50%; background:var(--accent-soft); }
  .drawer-head .name{ font-size:16px; font-weight:800; }
  .drawer-head .role{ font-size:11px; color:var(--muted); margin-top:2px; }
  .drawer-head .tap-hint{ margin-left:auto; font-size:10px; color:var(--accent); font-weight:700; flex:0 0 auto; }

  .drawer-list{ flex:1; overflow-y:auto; padding:8px 10px 18px; scrollbar-width:none; }
  .drawer-list::-webkit-scrollbar{ display:none; }

  .nav-row{ display:flex; align-items:center; gap:11px; width:100%; border:none; background:transparent; color:var(--ink); text-align:left; padding:10px 10px; border-radius:13px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .nav-row .emoji{ width:26px;height:26px; border-radius:9px; background:var(--surface-alt); display:flex;align-items:center;justify-content:center; font-size:14px; flex:0 0 auto; }
  .nav-row .label{ flex:1; }
  .nav-row .chev{ color:var(--muted); font-size:11px; transition:transform .2s ease; flex:0 0 auto; }
  .nav-row.active{ background:var(--accent-grad); color:var(--accent-ink); }
  .nav-row.active .emoji{ background:rgba(255,255,255,0.22); }
  .nav-row.active .chev{ color:var(--accent-ink); }
  .nav-row.parent-open .chev{ transform:rotate(90deg); }

  .nav-children{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .24s ease; }
  .nav-children > div{ overflow:hidden; }
  .nav-group.open .nav-children{ grid-template-rows:1fr; }
  .nav-children .nav-row{ padding-left:44px; font-size:12.5px; font-weight:500; }
  .nav-children .nav-row .emoji{ width:22px;height:22px;font-size:12px; }

  .drawer-foot{ padding:12px 20px 20px; font-size:10px; color:var(--muted); border-top:1px solid var(--line); display:flex; justify-content:space-between; flex:0 0 auto; }

  .rail{ position:absolute; top:50px; left:0; bottom:0; width:56px; background:var(--surface); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-right:1px solid var(--line); z-index:50; transform:translateX(-100%); transition:transform .28s ease; display:flex; flex-direction:column; align-items:center; padding:10px 0; gap:6px; overflow-y:auto; scrollbar-width:none; }
  .rail::-webkit-scrollbar{ display:none; }
  .app.rail-open .rail{ transform:translateX(0); }
  .app.rail-open .appbar{ margin-left:56px; }
  .app.rail-open .content{ margin-left:56px; }
  .app.rail-open .detail{ left:56px; }
  .rail-icon{ width:38px; height:38px; border-radius:12px; border:none; background:transparent; display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; color:var(--ink); flex:0 0 auto; }
  .rail-icon.active{ background:var(--accent-grad); color:var(--accent-ink); }
  .rail-menu-btn{ width:38px;height:38px; border-radius:12px; border:none; background:var(--surface-alt); display:flex; align-items:center; justify-content:center; cursor:pointer; margin-bottom:6px; flex:0 0 auto; color:var(--ink); }

  .reorder-toggle{ margin:8px 14px 0; border:1px solid var(--line); background:var(--surface-alt); color:var(--accent); font-weight:700; font-size:11px; padding:7px; border-radius:11px; cursor:pointer; text-align:center; }
  .reorder-btns{ display:flex; flex-direction:column; gap:2px; flex:0 0 auto; }
  .reorder-btns button{ width:20px; height:15px; border:none; background:var(--surface-alt); color:var(--ink); font-size:9px; border-radius:4px; cursor:pointer; line-height:1; padding:0; }

  .detail{ position:absolute; inset:0; background:var(--bg); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .3s cubic-bezier(.32,.72,.35,1); z-index:40; }
  .app.detail-open .detail{ transform:translateX(0); }
  .detail-bar{ display:flex; align-items:center; gap:12px; padding:calc(16px + env(safe-area-inset-top)) 18px 12px; flex:0 0 auto; }
  .detail-bar .title{ font-size:15.5px; font-weight:800; flex:1; }
  .detail-body{ flex:1; overflow-y:auto; padding:2px 18px 30px; scrollbar-width:none; display:flex; flex-direction:column; gap:12px; }
  .detail-body::-webkit-scrollbar{ display:none; }

  .detail-hero{ background:var(--surface-alt); border-radius:18px; padding:16px; display:flex; align-items:center; gap:12px; }
  .detail-hero .big-emoji{ width:44px;height:44px; border-radius:13px; background:var(--surface); display:flex;align-items:center;justify-content:center; font-size:22px; flex:0 0 auto; }
  .detail-hero h4{ margin:0 0 3px; font-size:14px; }
  .detail-hero p{ margin:0; font-size:11.5px; color:var(--muted); }

  .row-card{ background:var(--surface); border:1px solid var(--line); border-radius:15px; padding:12px 13px; }
  .row-title{ font-size:13px; font-weight:700; margin:0 0 3px; }
  .row-sub{ font-size:11.5px; color:var(--muted); margin:0; line-height:1.55; }
  .row-head{ display:flex; align-items:center; gap:8px; }

  .bar-track{ height:8px; background:var(--surface-alt); border-radius:999px; overflow:hidden; margin-top:8px; }
  .bar-fill{ height:100%; background:var(--accent-grad); border-radius:999px; }

  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .chip{ font-size:10px; padding:4px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:700; }
  .sel-chip{ font-size:11.5px; padding:6px 11px; border-radius:999px; background:var(--surface-alt); color:var(--ink); border:1px solid var(--line); font-weight:600; cursor:pointer; }
  .sel-chip.active{ background:var(--accent-grad); color:var(--accent-ink); border-color:var(--accent); }

  .swatch{ width:34px;height:34px; border-radius:10px; flex:0 0 auto; }

  .badge{ font-size:9.5px; font-weight:800; padding:3px 8px; border-radius:999px; letter-spacing:.02em; }
  .badge.tt{ background:#111; color:#fff; }
  .badge.xhs{ background:#fe3266; color:#fff; }
  .badge.yt{ background:#ff0033; color:#fff; }

  .link-btn{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:6px 11px; border-radius:999px; border:none; cursor:pointer; text-decoration:none; margin-top:8px; }
  .audio-btn{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-soft); border:none; padding:5px 10px; border-radius:999px; cursor:pointer; flex:0 0 auto; white-space:nowrap; }
  .refresh-btn{ font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-soft); border:none; padding:5px 10px; border-radius:999px; cursor:pointer; flex:0 0 auto; white-space:nowrap; }

  .field-label{ font-size:11px; font-weight:700; color:var(--muted); margin:0 0 5px; display:block; }
  .field{ width:100%; border:1px solid var(--line); background:var(--surface); border-radius:11px; padding:9px 11px; font-size:12.5px; color:var(--ink); font-family:inherit; }
  .field:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  textarea.field{ resize:vertical; min-height:64px; }
  .field-row{ display:flex; gap:8px; }
  .field-row .field{ flex:1; min-width:0; }

  .btn-primary{ width:100%; border:none; background:var(--accent-grad); color:var(--accent-ink); font-weight:700; font-size:13px; padding:10px; border-radius:12px; cursor:pointer; font-family:inherit; }
  .btn-ghost{ border:1px dashed var(--line); background:transparent; color:var(--muted); font-weight:700; font-size:12px; padding:9px; border-radius:11px; cursor:pointer; font-family:inherit; width:100%; }

  .add-row{ display:flex; gap:8px; }
  .add-row .field{ flex:1; }
  .add-row button{ flex:0 0 auto; width:44px; border:none; background:var(--accent-grad); color:var(--accent-ink); border-radius:11px; font-size:18px; font-weight:700; cursor:pointer; }

  .banner{ border-radius:15px; padding:12px 14px; font-size:12px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .banner.ok{ background:var(--ok-soft); color:var(--ok); }
  .banner.warn{ background:var(--warn-soft); color:var(--warn); }
  .banner.danger{ background:var(--danger-soft); color:var(--danger); }

  .thumb{ width:100%; aspect-ratio:4/3; border-radius:13px; object-fit:cover; background:var(--surface-alt); }
  .upload-label{ display:flex; align-items:center; justify-content:center; gap:6px; border:1.5px dashed var(--line); border-radius:13px; padding:14px; font-size:12px; color:var(--muted); font-weight:700; cursor:pointer; }
  .upload-label input{ display:none; }

  .voc{ font-weight:700; text-decoration:underline; text-decoration-color:var(--accent); text-underline-offset:2px; }
  .gem{ font-weight:700; font-style:italic; text-decoration:underline; text-decoration-color:var(--accent-2); text-underline-offset:2px; }
  .dict-word{ text-decoration:underline dotted; text-decoration-color:var(--accent); text-underline-offset:2px; cursor:pointer; font-weight:700; color:var(--ink); }

  .divider-label{ font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin:2px 0 -2px; }

  .flatlay{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .flatlay .slot{ aspect-ratio:1/1; border-radius:12px; overflow:hidden; background:var(--surface-alt); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); text-align:center; padding:6px; font-weight:700; }
  .flatlay .slot img{ width:100%; height:100%; object-fit:cover; }

  .month-tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .month-tab{ flex:0 0 auto; font-size:11px; font-weight:700; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; white-space:nowrap; }
  .month-tab.active{ background:var(--accent-grad); color:var(--accent-ink); border-color:var(--accent); }

  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:8px; }
  .cal-dow{ font-size:9px; color:var(--muted); text-align:center; font-weight:700; }
  .cal-cell{ aspect-ratio:1/1; border-radius:8px; background:var(--surface-alt); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:8px; color:var(--muted); gap:1px; }
  .cal-cell .d{ font-weight:700; font-size:10px; color:var(--ink); }
  .cal-cell.spent{ background:var(--accent-grad); color:#fff; }
  .cal-cell.spent .d{ color:#fff; }
  .cal-cell.empty{ background:transparent; }
  .cal-cell.cal-today{ box-shadow:inset 0 0 0 2px var(--accent); }
  .cal-cell.cal-selected{ box-shadow:inset 0 0 0 2px var(--ink); }
  .month-switcher{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .month-switcher .month-switcher-label{ font-weight:800; font-size:13px; flex:1; text-align:center; }
  .month-nav-btn{ border:1px solid var(--line); background:var(--surface-alt); color:var(--ink); border-radius:999px; width:28px; height:28px; font-weight:700; cursor:pointer; }

  .legend-row{ display:flex; align-items:center; gap:8px; font-size:11.5px; padding:4px 0; }
  .photo-gallery{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .photo-gallery .photo-item{ position:relative; width:72px; height:72px; flex:0 0 auto; }
  .photo-gallery .photo-item img{ width:100%; height:100%; object-fit:cover; border-radius:10px; }

(function(){

  var TRASH_ICON = '<svg viewBox="0 0 16 16" fill="none" width="13" height="13"><path d="M3 4.5H13M6.3 4.5V3.2C6.3 2.7 6.7 2.3 7.2 2.3H8.8C9.3 2.3 9.7 2.7 9.7 3.2V4.5M4.4 4.5L4.9 12.3C4.95 13 5.5 13.5 6.2 13.5H9.8C10.5 13.5 11.05 13 11.1 12.3L11.6 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function attrEsc(s){ return esc(s).replace(/"/g,"&quot;"); }
  function formatDateEn(dateStr){
    if(!dateStr) return "";
    var d = new Date(dateStr+"T00:00:00");
    if(isNaN(d.getTime())) return dateStr;
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return d.getDate()+" "+months[d.getMonth()]+" "+d.getFullYear();
  }
  function formatJournalDate(dateStr, tab){
    if(!dateStr) return "";
    var d = new Date(dateStr+"T00:00:00");
    if(isNaN(d.getTime())) return dateStr;
    var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    if(tab === "Monthly") return months[d.getMonth()]+" "+d.getFullYear();
    if(tab === "Yearly") return String(d.getFullYear());
    return formatDateEn(dateStr);
  }
  function plainText(html){ var d=document.createElement('div'); d.innerHTML=html; return d.textContent||""; }
  function dayIndex(){ return Math.floor(Date.now()/86400000); }
  function dailyPick(pool, count){
    count = count || 1;
    var start = dayIndex() % pool.length;
    var out = [];
    for(var i=0;i<Math.min(count,pool.length);i++){ out.push(pool[(start+i)%pool.length]); }
    return out;
  }
  function row(title, sub){ return '<div class="row-card"><p class="row-title">'+title+'</p><p class="row-sub">'+sub+'</p></div>'; }
  function callGroqJSON(apiKey, prompt){
    var url = 'https://api.groq.com/openai/v1/chat/completions';
    return fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+apiKey},
      body: JSON.stringify({
        model:'llama-3.3-70b-versatile',
        messages:[{role:'user', content:prompt}],
        temperature:0.9,
        response_format:{type:'json_object'}

  function pcmToWavBlob(base64Pcm, sampleRate){
    var binary = atob(base64Pcm);
    var len = binary.length;
    var pcmBytes = new Uint8Array(len);
    for(var i=0;i<len;i++){ pcmBytes[i] = binary.charCodeAt(i); }
    var numChannels=1, bitsPerSample=16;
    var byteRate = sampleRate*numChannels*bitsPerSample/8;
    var blockAlign = numChannels*bitsPerSample/8;
    var buffer = new ArrayBuffer(44+pcmBytes.length);
    var view = new DataView(buffer);
    function writeStr(offset,str){ for(var j=0;j<str.length;j++) view.setUint8(offset+j, str.charCodeAt(j)); }
    writeStr(0,'RIFF'); view.setUint32(4, 36+pcmBytes.length, true); writeStr(8,'WAVE');
    writeStr(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,numChannels,true);
    view.setUint32(24,sampleRate,true); view.setUint32(28,byteRate,true); view.setUint16(32,blockAlign,true); view.setUint16(34,bitsPerSample,true);
    writeStr(36,'data'); view.setUint32(40,pcmBytes.length,true);
    new Uint8Array(buffer,44).set(pcmBytes);
    return new Blob([buffer], {type:'audio/wav'});

  var ttsCache = {};
  function callGeminiTTS(apiKey, text){
    if(ttsCache[text]) return Promise.resolve(ttsCache[text]);
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key='+encodeURIComponent(apiKey);
    return fetch(url, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        contents:[{parts:[{text:text}]}],
        generationConfig:{ responseModalities:["AUDIO"], speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:"Kore"}}} }
      })
    }).then(function(r){
      if(!r.ok) throw new Error('Gemini TTS failed ('+r.status+')');

    }).then(function(data){
      var part = data.candidates[0].content.parts[0];
      var base64 = part.inlineData.data;
      var mime = part.inlineData.mimeType || '';
      var rateMatch = /rate=(\d+)/.exec(mime);

  function playWithSystemVoice(el, text){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    resetAudioButtons();
    var sentences = splitSentences(text);
    var v = pickVoice(state.voiceLang);
    var i = 0;
    function prosodyFor(sentence, idx){
      var last = sentence.trim().slice(-1);
      var words = sentence.trim().split(/\s+/).length;
      if(last==='?') return {rate:0.95, pitch:1.09};
      if(last==='!') return {rate:0.98, pitch:1.06};
      if(words>22) return {rate:0.89, pitch:0.99};
      var jitter = [0.98,1.0,1.02,1.0][idx%4];
      return {rate: words<8 ? 0.95 : 0.92, pitch: jitter};
    }
    function speakNext(){
      if(audioState.playingId !== el.id) return;
      if(i >= sentences.length){
        audioState.playingId=null; audioState.paused=false;
        if(document.getElementById(el.id)) el.textContent="🔊 Play";
        return;
      }
      var sentence = sentences[i];
      var p = prosodyFor(sentence, i);
      var u = new SpeechSynthesisUtterance(sentence);
      u.lang = state.voiceLang; if(v) u.voice = v;
      u.rate = p.rate; u.pitch = p.pitch;
      var isLast = (i+1) >= sentences.length;
      i++;
      u.onend = function(){
        if(audioState.playingId !== el.id) return;
        if(isLast){ speakNext(); return; }
        setTimeout(speakNext, 180);
      };
      u.onerror = function(){ audioState.playingId=null; audioState.paused=false; if(document.getElementById(el.id)) el.textContent="🔊 Play"; };
      window.speechSynthesis.speak(u);
    }
    audioState.playingId = el.id; audioState.paused=false; audioState.engine='system';
    el.textContent = "⏸ Pause";
    speakNext();
  }

  function toggleAudioButton(el, text){
    if(!text) return;
    if(audioState.playingId === el.id){
      if(audioState.engine === 'gemini' && audioState.audioEl){
        if(audioState.paused){ audioState.audioEl.play(); audioState.paused=false; el.textContent="⏸ Pause"; }
        else { audioState.audioEl.pause(); audioState.paused=true; el.textContent="▶ Resume"; }
      } else if('speechSynthesis' in window){
        if(audioState.paused){ window.speechSynthesis.resume(); audioState.paused=false; el.textContent="⏸ Pause"; }
        else { window.speechSynthesis.pause(); audioState.paused=true; el.textContent="▶ Resume"; }
      }
      return;
    }
    stopAudio();
    if(state.geminiApiKey){
      audioState.playingId = el.id; audioState.paused=false; audioState.engine='gemini';
      el.textContent = "⏳ Loading…";
      callGeminiTTS(state.geminiApiKey, text).then(function(url){
        if(audioState.playingId !== el.id) return;

        };
        audioEl.play();
        if(document.getElementById(el.id)) el.textContent = "⏸ Pause";
      }).catch(function(){
        if(audioState.playingId === el.id){ audioState.playingId=null; audioState.engine=null; }
        playWithSystemVoice(el, text);
      });
    } else {
      playWithSystemVoice(el, text);
    }
  }

    var repl = [
      [/\bvery good\b/gi,"excellent"], [/\ba lot of\b/gi,"a great deal of"], [/\bI think\b/gi,"In my view,"],
      [/\bkind of\b/gi,"somewhat"], [/\bstuff\b/gi,"materials"], [/\bwanna\b/gi,"want to"], [/\bgonna\b/gi,"going to"],
      [/\bbig problem\b/gi,"significant challenge"], [/\bhelp(ed)? me a lot\b/gi,"was extremely helpful"],
      [/\bI are\b/gi,"I am"], [/\bI have lot of\b/gi,"I have extensive"], [/\bgood fit\b/gi,"strong fit"]
    ];
    var out = text;
    repl.forEach(function(r){ out = out.replace(r[0], r[1]); });
    out = out.charAt(0).toUpperCase()+out.slice(1);
    if(!/[.!?]$/.test(out.trim())) out = out.trim()+".";
    return out;
  }

  /* ---------------- persistence: versioned save / load / migrate ---------------- */
  var STORAGE_KEY = 'shirley-app-data';
  var SCHEMA_VERSION = 1;

  // Add a migration function here whenever SCHEMA_VERSION is bumped in the future.
  // Each entry transforms the raw saved `data` object from the version before it
  // into the shape the current code expects, WITHOUT dropping fields it doesn't
  // recognize yet (so a half-finished migration never wipes real user data).
  // Example for the future:
  // var MIGRATIONS = {
  //   2: function(data){ data.newField = data.newField || "default"; return data; }
  // };
  var MIGRATIONS = {};

  function migrateState(saved){
    var version = saved.__version || 0;
    var data = saved.data || {};
    while(version < SCHEMA_VERSION){
      version++;
      if(MIGRATIONS[version]){
        try{ data = MIGRATIONS[version](data); }
        catch(e){ break; } // a broken migration should never crash the app or lose the raw data
      }
    }
    return data;
  }

  function todayStr(){
    var d = new Date();
    var m = d.getMonth()+1, day = d.getDate();
    return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;
  }
  function daysBetween(a, b){
    return Math.round((new Date(b+'T00:00:00').getTime() - new Date(a+'T00:00:00').getTime()) / 86400000);
  }
  function updatePetStreak(){
    var today = todayStr();
    if(!state.petStreakInitialized){
      // first time this mechanic runs — seed from the old calendar-age so an existing pet doesn't visually regress
      var legacyAgeDays = Math.max(1, Math.floor((Date.now() - new Date(state.petBirthDate).getTime())/86400000));
      state.petStreakDays = legacyAgeDays;
      state.petStreakInitialized = true;
      state.petLastActiveDate = today;
      state.petDead = false;
      state.petReminder = false;
      return;
    }
    if(state.petDead || state.petLastActiveDate === today) return;
    var gap = daysBetween(state.petLastActiveDate, today);
    if(gap === 1){
      state.petStreakDays = (state.petStreakDays||0) + 1;
      state.petReminder = false;
    } else if(gap === 2 || gap === 3){
      state.petStreakDays = 1;
      state.petReminder = true;
    } else if(gap > 3){
      state.petDead = true;
      state.petReminder = false;
    }
    state.petLastActiveDate = today;
  }
  function revivePet(){
    state.petDead = false;
    state.petReminder = false;
    state.petStreakDays = 1;
    state.petLastActiveDate = todayStr();
    state.petBirthDate = todayStr();
  }
  function shiftMonth(ym, delta){
    var p = ym.split("-"); var d = new Date(Number(p[0]), Number(p[1])-1+delta, 1);

    }
    state.planLastSavedDate = today;
  }
  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      var saved = JSON.parse(raw);
      var data = migrateState(saved);
      Object.keys(data).forEach(function(k){ state[k] = data[k]; });

  function saveState(){

  function exportBackup(){
    var payload = JSON.stringify({__version:SCHEMA_VERSION, data:state}, null, 2);
    var blob = new Blob([payload], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'shirley-app-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);

    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);

  function shuffleArr(arr){
    var a = arr.slice();
    for(var i=a.length-1; i>0; i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function buildWordPool(){
    var pool = [];
    LIFE_VOCAB.forEach(function(w){ pool.push({en:w.en, cn:w.cn}); });
    LEVEL_VOCAB.forEach(function(w){ pool.push({en:w.w, cn:w.cn}); });
    return pool;
  }
  function nextQuestion(g){
    if(g.poolIdx >= g.pool.length){ g.pool = shuffleArr(buildWordPool()); g.poolIdx = 0; }
    var entry = g.pool[g.poolIdx++];
    var promptLang = (g.qCount % 2 === 0) ? 'en' : 'cn';
    g.qCount++;
    var prompt = promptLang==='en' ? entry.en : entry.cn;
    var correct = promptLang==='en' ? entry.cn : entry.en;
    var others = buildWordPool().filter(function(e){ return e.en !== entry.en; });
    var distractors = shuffleArr(others).slice(0,3).map(function(e){ return promptLang==='en' ? e.cn : e.en; });
    g.current = {prompt:prompt, promptLang:promptLang, correct:correct, options:shuffleArr([correct].concat(distractors))};
  }
  function startWordGame(){
    var pool = shuffleArr(buildWordPool());
    state.wordGame = {pool:pool, poolIdx:0, qCount:0, current:null, correct:0, wrong:0, zombieSteps:0, maxSteps:6, hp:6, maxHp:6, over:false, result:null, busy:false, feedback:null};
    nextQuestion(state.wordGame);
    renderDetail();
  }
  function answerQuestion(optionText){
    var g = state.wordGame;
    if(!g || g.over || g.busy) return;
    g.busy = true;
    var isCorrect = optionText === g.current.correct;
    g.feedback = {picked:optionText, correct:isCorrect};
    if(isCorrect){ g.correct++; g.hp = Math.max(0, g.hp-1); }
    else { g.wrong++; g.zombieSteps = Math.min(g.maxSteps, g.zombieSteps+1); }
    renderDetail();
    setTimeout(function(){
      if(currentPageId !== 'wordgame') return;
      if(g.hp<=0){ g.over=true; g.result='win'; }
      else if(g.zombieSteps>=g.maxSteps){ g.over=true; g.result='eaten'; }
      else { nextQuestion(g); }
      g.busy=false; g.feedback=null;
      renderDetail();
    }, 700);
  }
  function pageWordGame(){
    var species = PET_SPECIES.find(function(s){ return s.id===state.petSpecies; }) || PET_SPECIES[0];
    if(!state.wordGame){
      return '<div class="row-card"><p class="row-title">Word Zombies 🧟</p>'
        +'<p class="row-sub" style="margin-top:6px;">Pick the matching meaning for each word. Answer right, you hit the zombie. Answer wrong, it takes a step toward '+species.name+'. Defeat it before it reaches your pet.</p>'
        +'<button class="btn-primary" style="margin-top:10px;" data-action="start-word-game">Start Game</button></div>';
    }
    var g = state.wordGame;
    var rate = (g.correct+g.wrong) ? Math.round(g.correct/(g.correct+g.wrong)*100) : 0;
    var petIdlePct = 88;
    var zombiePct = Math.min(petIdlePct, (g.zombieSteps/g.maxSteps)*petIdlePct);
    var showZombie = !(g.over && g.result==='win');
    var showPet = !(g.over && g.result==='eaten');
    var petPct = (g.over && g.result==='win') ? zombiePct : petIdlePct;
    var html = '<div class="row-card">';
    html += '<div class="zombie-lane"><div class="path"></div>'
      + (showZombie ? '<div class="zombie" style="left:'+zombiePct+'%;">🧟</div>' : '')
      + (showPet ? '<div class="base" style="left:'+petPct+'%;">'+species.emoji+'</div>' : '<div class="base" style="left:'+petIdlePct+'%; opacity:.3;">💨</div>')
      + '</div>';
    html += bar("Zombie HP — "+g.hp+"/"+g.maxHp, Math.round(g.hp/g.maxHp*100));
    html += '<div class="word-score-row"><div class="stat"><div class="num" style="color:var(--ok);">'+g.correct+'</div><div class="lbl">Correct</div></div><div class="stat"><div class="num" style="color:var(--danger);">'+g.wrong+'</div><div class="lbl">Wrong</div></div><div class="stat"><div class="num accent">'+rate+'%</div><div class="lbl">Accuracy</div></div></div>';
    html += '</div>';
    if(g.over){
      var bannerText = g.result==='win' ? '🧟💀 Zombie defeated! '+species.name+' wins with '+rate+'% accuracy.' : '🧟 The zombie reached '+species.name+'... better luck next time.';
      html += '<div class="banner '+(g.result==='win'?"ok":"danger")+'">'+bannerText+'</div>';
      html += '<button class="btn-primary" data-action="start-word-game">Play Again</button>';
    } else if(g.current){
      html += '<div class="row-card quiz-prompt"><p class="row-sub">'+(g.current.promptLang==='en'?"What does this mean?":"Pick the English word:")+'</p><p class="word">'+esc(g.current.prompt)+'</p></div>';
      html += '<div class="quiz-grid">';
      g.current.options.forEach(function(opt){
        var cls = '';
        if(g.feedback){
          if(opt===g.current.correct) cls = 'correct';
          else if(opt===g.feedback.picked) cls = 'wrong';
        }
        html += '<button class="quiz-option '+cls+'" data-action="answer-quiz" data-text="'+attrEsc(opt)+'">'+esc(opt)+'</button>';
      });
      html += '</div>';
    }
    return html;
  }

  function formatMonthLabel(ym){ var p=ym.split("-"); var names=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return names[Number(p[1])-1]+"-"+p[0]; }
  var CHART_COLORS = ["#db5079","#c9a24a","#3fa66b","#5b8def","#e2a63b","#9b6bd6","#4bbfc0"];

  function buildDonut(byCat, total){
    var cats = Object.keys(byCat);
    if(!cats.length) return '<p class="row-sub" style="text-align:center;padding:16px 0;">No spending recorded for this month yet.</p>';
    var r=42, c=2*Math.PI*r, offset=0, arcs='';
    cats.forEach(function(cat,i){
      var len = byCat[cat]/total*c;
      arcs += '<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="'+CHART_COLORS[i%CHART_COLORS.length]+'" stroke-width="14" stroke-dasharray="'+len+' '+(c-len)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 50 50)"/>';
      offset += len;
    });
    var svg = '<svg viewBox="0 0 100 100" style="width:150px;height:150px;display:block;margin:0 auto;">'+arcs+'<text x="50" y="47" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.6" font-weight="700">TOTAL</text><text x="50" y="60" text-anchor="middle" font-size="11" fill="currentColor" font-weight="800">S$'+total+'</text></svg>';
    var legend = cats.map(function(cat,i){ var pct=Math.round(byCat[cat]/total*100); return '<div class="legend-row"><span class="legend-dot" style="background:'+CHART_COLORS[i%CHART_COLORS.length]+'"></span><span style="flex:1;">'+cat+'</span><span style="color:var(--muted);">'+pct+'%</span><span style="font-weight:700;margin-left:6px;">S$'+byCat[cat]+'</span></div>'; }).join('');
    return svg + '<div style="margin-top:10px;color:var(--ink);">'+legend+'</div>';
  }

  function buildCalendar(ym, entries){
    var byDay = {};
    entries.forEach(function(e){ byDay[e.date] = (byDay[e.date]||0)+Number(e.amt); });
    var maxDay = Math.max.apply(null, Object.keys(byDay).map(function(d){return byDay[d];}).concat([1]));
    var p = ym.split("-"); var y=Number(p[0]), mo=Number(p[1])-1;
    var firstDow = new Date(y,mo,1).getDay();
    var daysInMonth = new Date(y,mo+1,0).getDate();
    var dows = ["S","M","T","W","T","F","S"];
    var html = '<div class="cal-grid">' + dows.map(function(d){return '<div class="cal-dow">'+d+'</div>';}).join('');
    for(var i=0;i<firstDow;i++){ html+='<div class="cal-cell empty"></div>'; }
    for(var d=1; d<=daysInMonth; d++){
      var dateStr = ym+"-"+(d<10?"0"+d:d);
      var amt = byDay[dateStr];
      if(amt){ html += '<div class="cal-cell spent" style="opacity:'+(0.45+0.55*(amt/maxDay)).toFixed(2)+'"><span class="d">'+d+'</span><span>'+amt+'</span></div>'; }
      else { html += '<div class="cal-cell"><span class="d">'+d+'</span></div>'; }
    }
    html += '</div>';
    return html;
  }

  function buildPlanCalendar(ym, selectedDate){
    var p = ym.split("-"); var y=Number(p[0]), mo=Number(p[1])-1;
    var firstDow = new Date(y,mo,1).getDay();
    var daysInMonth = new Date(y,mo+1,0).getDate();
    var dows = ["S","M","T","W","T","F","S"];
    var today = todayStr();
    var html = '<div class="cal-grid">' + dows.map(function(d){return '<div class="cal-dow">'+d+'</div>';}).join('');
    for(var i=0;i<firstDow;i++){ html+='<div class="cal-cell empty"></div>'; }
    for(var d=1; d<=daysInMonth; d++){
      var dateStr = ym+"-"+(d<10?"0"+d:d);
      var hasData = !!state.planHistory[dateStr] || dateStr===today;
      var cls = 'cal-cell'+(hasData?' spent':'')+(dateStr===today?' cal-today':'')+(dateStr===selectedDate?' cal-selected':'');
      html += '<div class="'+cls+'"'+(hasData?' data-action="view-plan-day" data-date="'+dateStr+'"':'')+'><span class="d">'+d+'</span></div>';
    }
    html += '</div>';
    return html;
  }

  function groupPrices(){

  function pagePriceCompare(){
    var html = '<div class="row-card"><p class="row-sub">Log prices as you shop. The cheapest price ever seen is bold red with a gold trophy, the cheapest in the last 30 days gets silver.</p>'

    Object.keys(groups).forEach(function(k){

      var recentItems = g.items.filter(function(p){ return (nowMs - new Date(p.date).getTime()) <= 30*86400000; });

  function renderNav(){
    var html = '';
    state.navOrder.forEach(function(id, idx){
      var item = NAV_BY_ID[id];
      if(!item) return;
      var topReorderCtl = state.reorderMode ? reorderControls(idx, state.navOrder.length, null, id) : '';
      var rowUnit;
      if(item.children){
        var childIds = state.childOrder[item.id] || [];
        rowUnit = '<div class="nav-group'+(state.reorderMode?" open":"")+'" data-group="'+item.id+'" style="flex:1; min-width:0;">'
          + '<button class="nav-row parent'+(state.reorderMode?" parent-open":"")+'" data-id="'+item.id+'"><span class="emoji">'+item.emoji+'</span><span class="label">'+item.label+'</span><span class="chev">›</span></button>'
          + '<div class="nav-children"><div>'
          + childIds.map(function(cid, cidx){
              var c = CHILD_BY_ID[cid];
              if(!c) return '';
              var childRow = '<button class="nav-row child" data-id="'+c.id+'"><span class="emoji">'+c.emoji+'</span><span class="label">'+c.label+'</span></button>';
              if(state.reorderMode){
                return '<div style="display:flex; align-items:center; gap:4px;">'+childRow+reorderControls(cidx, childIds.length, item.id, c.id)+'</div>';
              }
              return childRow;
            }).join('')
          + '</div></div></div>';
      } else {
        rowUnit = '<button class="nav-row leaf" data-id="'+item.id+'" style="flex:1; min-width:0;"><span class="emoji">'+item.emoji+'</span><span class="label">'+item.label+'</span></button>';
      }
      html += state.reorderMode ? ('<div style="display:flex; align-items:center; gap:4px;">'+rowUnit+topReorderCtl+'</div>') : rowUnit;
    });
    navList.innerHTML = html;
    scheduleSave();

  navList.addEventListener('click', function(e){
    var moveBtn = e.target.closest('[data-action="move-nav-up"], [data-action="move-nav-down"]');
    if(moveBtn){
      var parentId = moveBtn.dataset.parent;
      var arr = parentId ? state.childOrder[parentId] : state.navOrder;
      var idx = Number(moveBtn.dataset.idx);
      var dir = moveBtn.dataset.action === 'move-nav-up' ? -1 : 1;
      var swapIdx = idx + dir;
      if(arr && swapIdx>=0 && swapIdx<arr.length){
        var tmp = arr[idx];
        arr[idx] = arr[swapIdx];
        arr[swapIdx] = tmp;
        renderNav(); renderRail();
      }
      return;
    }
    var delBtn = e.target.closest('[data-action="delete-nav-item"]');
    if(delBtn){
      var dParent = delBtn.dataset.parent;
      var dId = delBtn.dataset.id;
      if(dParent){
        var carr = state.childOrder[dParent];
        var ci = carr ? carr.indexOf(dId) : -1;
        if(ci>-1) carr.splice(ci,1);
      } else {
        var ti = state.navOrder.indexOf(dId);
        if(ti>-1) state.navOrder.splice(ti,1);
      }
      if(currentPageId === dId){ currentPageId = null; app.classList.remove('detail-open'); }
      renderNav(); renderRail();
      return;
    }
    if(state.reorderMode) return;
    var parentBtn = e.target.closest('.nav-row.parent');
    if(parentBtn){
      var group = parentBtn.closest('.nav-group');
      var wasOpen = group.classList.contains('open');
      navList.querySelectorAll('.nav-group.open').forEach(function(g){ g.classList.remove('open'); g.querySelector('.nav-row.parent').classList.remove('parent-open'); });
      if(!wasOpen){ group.classList.add('open'); parentBtn.classList.add('parent-open'); }
      return;
    }
    var leafBtn = e.target.closest('.nav-row.leaf, .nav-row.child');
    if(leafBtn){ selectItem(leafBtn.dataset.id); }
  });

      state.interviewCompany = co; state.interviewRole = role; state.interviewJd = jd;
      state.interviewCompanyInfo = companyInfo; state.interviewCustomNotes = customNotes;
      state.resumeText = resumeHighlights;

      function templateQA(){
        var list = [
          {q:"Why are you interested in the "+role+" position at "+co+"?", a:"I have followed "+co+"'s growth and I am drawn to how the "+role+" role blends people strategy with hands-on execution, that mix is exactly where I do my best work."},
          {q:"Tell me about a time you managed a difficult stakeholder.", a:"Using the STAR method: a hiring manager kept changing requirements mid-search. I set a weekly 15-minute sync to lock scope, which cut our time-to-fill by three weeks."},
          {q:"How would you approach your first 90 days in this role?", a:"First 30 days listening and mapping stakeholders, next 30 shipping one visible quick win, final 30 proposing a longer-term plan backed by data."},
          {q:"What is a mistake you made in HR and what did you learn?", a:"Early on I under-communicated a policy change and it caused confusion. Now I always pair any policy update with a short FAQ and a live Q&A session."}
        ];
        if(jd){ list.unshift({q:"Based on the JD, what is the top priority for this role?", a:"Reading the JD closely, the core priority looks like "+jd.split(/[.\n]/)[0].slice(0,80)+", I would focus my first weeks proving traction there."}); }
        var tailored = state.selfIntro.replace(/\.\s*$/, "")+", and I'm especially excited about the "+role+" opportunity at "+co+(jd ? ", where my background lines up closely with what the JD is asking for." : ".");
        return {company:co, role:role, list:list, tailoredIntro:tailored, aiGenerated:false};

        state.interviewQAError = null;

          + (jd ? " Job description:\n"+jd.slice(0,3000) : " No job description was provided.")
          + (companyInfo ? "\n\nCompany portal link or company intro provided by the candidate (use it for real context about the company, if it's a URL just use your knowledge of that company/site if you recognise it): "+companyInfo.slice(0,1000) : "")
          + "\n\nThe candidate's own self-introduction (use it for tone/background): \""+state.selfIntro+"\""
          + (resumeHighlights ? "\n\nThe candidate's actual resume highlights, ground the questions and tailored intro in these real specifics rather than generic language: "+resumeHighlights.slice(0,2000) : "")
          + (customNotes ? "\n\nThe candidate's own requirements for this mock interview, follow these closely (e.g. desired number of questions, topics to focus on): "+customNotes.slice(0,500) : "")
          + "\n\nReply with ONLY raw JSON, no markdown fences, in exactly this shape:\n"
          + '{"questions":[{"q":"...","a":"..."} ... at least 8 items unless the candidate\'s own requirements above ask for a different number, genuinely specific to this company/role/JD (and resume, if provided), not generic filler],"tailoredIntro":"a 3-4 sentence self-introduction, written in the candidate\'s own voice as if answering \'tell me about yourself\', reworked to foreground the parts of the candidate\'s background (especially resume highlights, if given) most relevant to this exact company and role"}'

        callGroqJSON(state.groqApiKey, prompt).then(function(data){

      var ntext = document.getElementById('notesText').value.trim();
      if(ntext || state.notesPhoto){
        state.dailyNotes.push({date:new Date().toISOString().slice(0,10), photo:state.notesPhoto, text:ntext});
        state.notesPhoto = null;
        renderDetail();
      }
    } else if(action === 'delete-notes'){
      state.dailyNotes.splice(el.dataset.idx,1);
      renderDetail();
    } else if(action === 'start-word-game'){
      startWordGame();
    } else if(action === 'answer-quiz'){
      answerQuestion(el.dataset.text);
    }
  });

  detailBody.addEventListener('change', function(e){
    var el = e.target;
    if(el.dataset.action === 'xhs-photo' && el.files[0]){ readImg(el.files[0], function(url){ state.xhsPhoto = url; renderDetail(); }); }
    else if(el.dataset.action === 'food-photo' && el.files[0]){ readImg(el.files[0], function(url){ state.foodPhoto = url; renderDetail(); }); }
    else if(el.dataset.action === 'closet-photo' && el.files[0]){ var cat = el.dataset.cat; readImg(el.files[0], function(url){ state.closetItems[cat].push(url); renderDetail(); }); }
    else if(el.dataset.action === 'notes-photo' && el.files[0]){ readImg(el.files[0], function(url){ state.notesPhoto = url; renderDetail(); }); }
    else if(el.dataset.action === 'tj-photo-add' && el.files[0]){ readImg(el.files[0], function(url){ state.travelJournalPhotos.push(url); renderDetail(); }); }
    else if(el.dataset.action === 'tj-edit-photo-add' && el.files[0]){ var tjIdx = el.dataset.idx; readImg(el.files[0], function(url){ state.travelJournal[tjIdx].photos = state.travelJournal[tjIdx].photos || []; state.travelJournal[tjIdx].photos.push(url); renderDetail(); }); }
    else if(el.dataset.action === 'journal-photo-add' && el.files[0]){ readImg(el.files[0], function(url){ state.journalPhotos.push(url); renderDetail(); }); }
    else if(el.dataset.action === 'journal-edit-photo-add' && el.files[0]){ var jIdx = el.dataset.idx; readImg(el.files[0], function(url){ var je = state.journal[state.journalTab][jIdx]; je.photos = je.photos || []; je.photos.push(url); renderDetail(); }); }
    else if(el.dataset.action === 'report-input'){ state.readingBooks[el.dataset.idx].report = el.value; }
    else if(el.id === 'resumeFileInput' && el.files[0]){
      var resumeFile = el.files[0];
      state.resumeFileName = resumeFile.name;
      var isTextLike = resumeFile.type === 'text/plain' || /\.(txt|md)$/i.test(resumeFile.name);
      if(isTextLike){
        var resumeReader = new FileReader();
        resumeReader.onload = function(ev){ state.resumeText = ev.target.result; renderDetail(); };
        resumeReader.readAsText(resumeFile);
      } else {
        renderDetail();
      }
    }
  });

  var recognitionObj = null, isRecording = false;
  function updateRecordBtnUI(targetId){
    var btnId = targetId==='rehearsalAnswerBox' ? 'rehearsalRecordBtn' : 'recordBtn';
    var btn = document.getElementById(btnId);
    if(!btn) return;
    if(isRecording){ btn.textContent="⏹ Stop Recording"; btn.classList.add('recording'); }
    else { btn.textContent="🎙 Start Recording"; btn.classList.remove('recording'); }
  }
  function toggleRecording(targetId){
    targetId = targetId || 'speakingInput';
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      var ta = document.getElementById(targetId);
      if(ta){ ta.placeholder = "Live recording isn't supported in this browser, type what you said instead."; }
      return;
    }
    if(!isRecording){
      recognitionObj = new SR();
      recognitionObj.lang = state.voiceLang === 'en-GB' ? 'en-GB' : 'en-US';
      recognitionObj.interimResults = false;
      recognitionObj.maxAlternatives = 1;
      recognitionObj.onresult = function(ev){
        var t = ev.results[0][0].transcript;
        var ta = document.getElementById(targetId);
        if(ta){ ta.value = t; }
        if(targetId==='speakingInput') state.speakingInput = t;
      };
      recognitionObj.onerror = function(){ isRecording=false; updateRecordBtnUI(targetId); };
      recognitionObj.onend = function(){ isRecording=false; updateRecordBtnUI(targetId); };
      try{ recognitionObj.start(); isRecording=true; updateRecordBtnUI(targetId); }
      catch(err){ isRecording=false; updateRecordBtnUI(targetId); }
    } else {
      recognitionObj.stop();
      isRecording=false; updateRecordBtnUI(targetId);
    }
  }
  function stopRecordingIfActive(){
    if(isRecording && recognitionObj){ recognitionObj.stop(); isRecording=false; }
  }

  /* ---------------- home dashboard ---------------- */
  var SCENE_DOG = '<svg class="bg" viewBox="0 0 300 130" preserveAspectRatio="xMidYMax slice">'
    +'<rect width="300" height="130" fill="url(#skyGrad)"/>'
    +'<circle cx="250" cy="30" r="18" fill="#ffe08a" opacity="0.9"/>'
    +'<path d="M0 95 Q75 75 150 95 T300 95 V130 H0 Z" fill="#8fcf8a"/>'

    +'<line x1="120" y1="104" x2="127" y2="122" stroke="#3a1f26" stroke-width="3" stroke-linecap="round"/>'
    +'<line x1="128" y1="88" x2="145" y2="98" stroke="#f6cda4" stroke-width="3" stroke-linecap="round"/>'
    +'<line x1="145" y1="98" x2="165" y2="104" stroke="#3a1f26" stroke-width="1.5"/>'
    +'<ellipse cx="178" cy="108" rx="14" ry="9" fill="#c98a4b"/>'

    +'</svg>';
  var SCENE_COFFEE = '<svg class="bg" viewBox="0 0 300 130" preserveAspectRatio="xMidYMax slice">'
    +'<rect width="300" height="130" fill="url(#skyGrad2)"/>'
    +'<circle cx="40" cy="28" r="16" fill="#ffe08a" opacity="0.85"/>'

    +'<rect x="150" y="86" width="46" height="4" rx="2" fill="#8a5a2f"/>'
    +'<line x1="160" y1="90" x2="160" y2="112" stroke="#8a5a2f" stroke-width="3"/>'
    +'<line x1="186" y1="90" x2="186" y2="112" stroke="#8a5a2f" stroke-width="3"/>'
    +'<circle cx="168" cy="78" r="9" fill="#f6cda4"/>'
    +'<path d="M161 75 q7 -9 14 0" stroke="#3a2a20" stroke-width="3" fill="none" stroke-linecap="round"/>'
    +'<rect x="160" y="86" width="16" height="20" rx="7" fill="#c9a24a"/>'
    +'<rect x="140" y="94" width="10" height="12" rx="2" fill="#fff"/>'
    +'<path d="M148 96 q6 2 4 8" stroke="#fff" stroke-width="1.5" fill="none"/>'
    +'<path d="M141 92 q2 -5 -1 -8 M145 92 q2 -6 0 -9" stroke="#cbb9a6" stroke-width="1.2" fill="none" stroke-linecap="round"/>'
    +'</svg>';

  function detectCountry(){
    try{
      var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      var MAP = {
        "Asia/Singapore":"Singapore","Asia/Kuala_Lumpur":"Malaysia","Asia/Bangkok":"Thailand",
        "Asia/Tokyo":"Japan","Asia/Seoul":"South Korea","Asia/Shanghai":"China","Asia/Hong_Kong":"Hong Kong",
        "Asia/Jakarta":"Indonesia","Australia/Sydney":"Australia","Europe/London":"United Kingdom",
        "America/New_York":"United States","America/Los_Angeles":"United States"
      };
      return MAP[tz] || "Singapore";
    } catch(e){ return "Singapore"; }
  }
  function renderHome(){
    var doneCount = state.tasks.filter(function(t){return t.done;}).length;
    var totalTasks = state.tasks.length || 1;
    var frac = doneCount/totalTasks;
    var food = Math.round(20 + frac*80);
    var water = Math.round(15 + frac*85);
    var species = PET_SPECIES.find(function(s){return s.id===state.petSpecies;}) || PET_SPECIES[0];
    var streakDays = state.petStreakDays||1;
    var stage = state.petDead ? "Gone" : streakDays<3 ? "Baby" : streakDays<10 ? "Growing" : "Grown";
    var faceSize = stage==="Baby" ? 24 : stage==="Growing" ? 32 : 40;
    var moodEmoji = species.emoji + " " + (state.petDead ? "💀" : frac>=1 ? "❤️" : frac>=0.5 ? "🙂" : frac>0 ? "😐" : "😢");
    var moodText = frac>=1 ? species.name+" is fully fed and happy!" : frac>=0.5 ? species.name+" is doing well, keep going!" : frac>0 ? species.name+" could use a bit more." : species.name+" is hungry, finish a task to feed!";
    document.getElementById('streakChip').textContent = state.petDead ? "💀 "+species.name+" passed away" : species.emoji+" "+species.name+" "+food+"% fed";

    var dayIdx = Math.floor((Date.now()/86400000)) % QUOTES.length;
    var quote = QUOTES[dayIdx];
    var sceneSvg = (Math.floor(Date.now()/86400000) % 2 === 0) ? SCENE_DOG : SCENE_COFFEE;
    var today = new Date();
    var hour = today.getHours();
    var greetWord = hour<5 ? "Good night" : hour<12 ? "Good morning" : hour<17 ? "Good afternoon" : hour<21 ? "Good evening" : "Good night";
    var greetEmoji = hour<5 ? "🌙" : hour<12 ? "☀️" : hour<17 ? "🌤️" : hour<21 ? "🌆" : "🌙";
    var country = detectCountry();
    var dateStr = today.toLocaleDateString('en-US', {month:'long', day:'numeric', weekday:'long'});

    var html = '<div class="card scene-card">'+sceneSvg+'<div class="txt"><h2>'+greetWord+', '+esc(state.bioName)+' '+greetEmoji+'</h2><p>'+dateStr+' · '+country+'</p>'
      +'<p style="margin-top:8px; font-style:italic; font-size:12px;">"'+quote.q+'"</p><p style="margin:2px 0 0; font-size:11px; font-weight:700;">&mdash; '+quote.a+'</p>'
      +'</div></div>';
    if(state.petDead){
      html += '<div class="card pet-card"><div class="pet-face" style="font-size:'+faceSize+'px; filter:grayscale(1); opacity:.6;">💀</div><div class="pet-meters">'
        +'<p class="row-title" style="margin:0;">'+species.name+' &middot; Gone</p>'
        +'<p class="row-sub" style="margin-top:6px;">😔 '+species.name+' didn\'t make it — too many days without a visit. Come back daily next time to help them grow.</p>'
        +'<button class="btn-primary" style="margin-top:10px;" data-action="revive-pet">🐣 Welcome a New '+species.label+'</button>'
        +'</div></div>';
    } else {
      html += '<div class="card pet-card"><div class="pet-face" style="font-size:'+faceSize+'px;">'+species.emoji+'</div><div class="pet-meters">'
        +'<div class="row-head"><p class="row-title" style="margin:0; flex:1;">'+species.name+' &middot; '+stage+'</p><button class="edit-icon-btn" data-action="toggle-pet-picker">✎ Change</button></div>'
        +'<div class="pet-meter-row"><span>🍚</span><div class="bar-track"><div class="bar-fill" style="width:'+food+'%; background:var(--ok);"></div></div><span>'+food+'%</span></div>'
        +'<div class="pet-meter-row"><span>💧</span><div class="bar-track"><div class="bar-fill" style="width:'+water+'%; background:#5b8def;"></div></div><span>'+water+'%</span></div>'
        +'<p class="row-sub" style="margin-top:6px;">'+moodText+'</p>'
        +'<p class="row-sub" style="margin-top:4px; font-weight:700; color:var(--accent);">🔥 '+streakDays+'-day streak</p>'
        + (state.petReminder ? '<p class="row-sub" style="margin-top:6px; color:var(--danger); font-weight:600;">⚠️ '+species.name+' missed you for a day! Visit daily or they won\'t make it past 3 days away.</p>' : '')
        +'</div></div>';
    }
    if(state.petPickerOpen){
      html += '<div class="chip-row" style="margin-top:8px;">'+PET_SPECIES.map(function(s){ return '<span class="sel-chip'+(state.petSpecies===s.id?" active":"")+'" data-action="pick-pet" data-id="'+s.id+'">'+s.emoji+' '+s.label+'</span>'; }).join('')+'</div>';
    }
    html += '<div class="stats-row">'
      +'<div class="stat"><div class="num gold">'+moodEmoji+'</div><div class="lbl">'+species.name+'’s mood</div></div>'
      +'<div class="stat"><div class="num accent">'+doneCount+'/'+state.tasks.length+'</div><div class="lbl">Done today</div></div>'
      +'<div class="stat"><div class="num accent">86</div><div class="lbl">Words learned</div></div>'
      +'</div>';
    html += '<div class="section-title"><h3>Today’s Plan</h3><span data-action="goto-plan">View all ›</span></div>';
    html += '<div class="plan-list" id="homeTaskList">';
    state.tasks.slice(0,4).forEach(function(t){
      html += '<div class="plan-item'+(t.done?' done':'')+'"><span class="chk'+(t.done?' on':'')+'" data-action="home-toggle-task" data-id="'+t.id+'">'+CHECK_ICON+'</span><span class="txt">'+esc(t.text)+'</span><span class="tag">'+t.cat+'</span></div>';
    });
    html += '</div>';
    homeContent.innerHTML = html;
    scheduleSave();
  }
  homeContent.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    if(el.dataset.action === 'home-toggle-task'){
      var t = state.tasks.find(function(x){return x.id==el.dataset.id;});
      if(t) t.done = !t.done;
      renderHome();
    } else if(el.dataset.action === 'goto-plan'){
      selectItem('plan');
    } else if(el.dataset.action === 'toggle-pet-picker'){
      state.petPickerOpen = !state.petPickerOpen;
      renderHome();
    } else if(el.dataset.action === 'pick-pet'){
      state.petSpecies = el.dataset.id;
      state.petPickerOpen = false;
      renderHome();
    } else if(el.dataset.action === 'revive-pet'){
      revivePet();
      renderHome();
    }
  });
  applyPalette(state.palette);
  updateAvatars();
  renderHome();

  function tick(){
    var now = new Date();
    var h = now.getHours(), m = now.getMinutes();
    document.getElementById('clock').textContent = (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  }
  tick();
  setInterval(tick, 15000);

  setInterval(saveState, 4000);
  window.addEventListener('pagehide', saveState);
  document.addEventListener('visibilitychange', function(){ if(document.hidden) saveState(); });
})();
</script>
